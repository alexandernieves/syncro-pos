# Builds the desktop app for Windows and Mac and publishes it as a GitHub release.
# Runs on our own Mac (self-hosted runner), which builds both installers.
# Starts when a tag like v1.1.1 is pushed; the tag must match "version" in desktop/package.json.
# Only tags and manual runs start it, never pull requests: nobody else's code runs on that Mac.
name: Desktop app

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: desktop-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: [self-hosted, macOS]
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - name: Check the tag matches the version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          v="v$(node -p "require('./package.json').version")"
          [ "$v" = "${GITHUB_REF_NAME}" ] || { echo "Tag ${GITHUB_REF_NAME} does not match package.json $v"; exit 1; }
      # One release first, so the uploads below don't race to create it
      - name: Create the release
        run: |
          tag="v$(node -p "require('./package.json').version")"
          code=$(curl -s -o /tmp/release.json -w "%{http_code}" -X POST \
            -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases" \
            -d "{\"tag_name\":\"$tag\",\"name\":\"$tag\",\"target_commitish\":\"${GITHUB_SHA}\"}")
          # 201 created; 422 means it already exists, which is fine
          [ "$code" = "201" ] || [ "$code" = "422" ] || { cat /tmp/release.json; exit 1; }
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish Windows
        run: npx electron-builder --win --x64 --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish Mac (unsigned)
        run: npx electron-builder --mac --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: Clean up
        if: always()
        run: rm -rf dist
