# Builds the desktop app for Windows and Mac and publishes it as a GitHub release.
# Runs on our own Mac (self-hosted runner), which builds both installers.
# Starts when a tag like v1.1.1 is pushed; the tag must match "version" in desktop/package.json.
# Only tags and manual runs start it, never pull requests: nobody else's code runs on that Mac.
name: Desktop app

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: desktop-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: [self-hosted, macOS]
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - name: Check the tag matches the version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          v="v$(node -p "require('./package.json').version")"
          [ "$v" = "${GITHUB_REF_NAME}" ] || { echo "Tag ${GITHUB_REF_NAME} does not match package.json $v"; exit 1; }
      - name: Build and publish Windows and Mac
        run: npx electron-builder --win --x64 --mac --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: Clean up
        if: always()
        run: rm -rf dist
