<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src 'self' file:">
<title>Syncro POS</title>
<style>
  :root { color-scheme: dark; --bg: #0b0b0c; --card: #151517; --line: #2a2a2e; --text: #f4f4f5; --muted: #a1a1aa; --primary: #f26b1d; --danger: #f87171; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--text); font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { width: min(440px, calc(100vw - 32px)); background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 28px; }
  img { width: 44px; height: 44px; border-radius: 10px; }
  h1 { font-size: 18px; margin: 16px 0 4px; }
  p { margin: 0 0 18px; color: var(--muted); }
  label { display: block; font-size: 12px; font-weight: 600; margin-bottom: 6px; }
  input { width: 100%; height: 42px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); color: var(--text); padding: 0 12px; font: inherit; outline: none; }
  input:focus { border-color: var(--primary); }
  .error { color: var(--danger); font-size: 12px; margin: 6px 0 0; min-height: 18px; }
  .row { display: flex; gap: 8px; margin-top: 14px; }
  button { flex: 1; height: 42px; border-radius: 10px; border: 1px solid var(--line); background: transparent; color: var(--text); font: inherit; font-weight: 600; cursor: pointer; }
  button.primary { background: var(--primary); border-color: var(--primary); color: #fff; }
  button:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <img src="../build/icon.png" alt="">
  <section id="offline" hidden>
    <h1>No se pudo abrir Syncro</h1>
    <p>Revisa que la computadora tenga internet. Si el problema sigue, puede que el servidor esté caído un momento.</p>
    <p id="offline-server"></p>
    <div class="row">
      <button id="change">Cambiar servidor</button>
      <button id="retry" class="primary">Reintentar</button>
    </div>
  </section>
  <section id="server" hidden>
    <h1>Servidor de Syncro</h1>
    <p>La dirección con la que entras a Syncro desde el navegador.</p>
    <form id="form">
      <label for="url">Dirección</label>
      <input id="url" placeholder="https://tu-negocio.ejemplo.com" autocomplete="off" spellcheck="false">
      <p class="error" id="error"></p>
      <div class="row">
        <button type="button" id="back">Volver</button>
        <button type="submit" class="primary">Conectar</button>
      </div>
    </form>
  </section>
</main>
<script>
  const q = new URLSearchParams(location.search);
  const server = q.get('server') || '';
  const $ = (id) => document.getElementById(id);
  const show = (mode) => {
    $('offline').hidden = mode !== 'offline';
    $('server').hidden = mode !== 'server';
    if (mode === 'server') { $('url').value = server; $('url').focus(); $('url').select(); }
    else $('retry').focus();
  };
  $('offline-server').textContent = server ? 'Servidor: ' + server : '';
  $('retry').onclick = () => window.electron.retry();
  $('change').onclick = () => show('server');
  $('back').onclick = () => (server ? window.electron.retry() : $('url').focus());
  $('form').onsubmit = async (e) => {
    e.preventDefault();
    let v = $('url').value.trim();
    if (v && !/^https?:\/\//i.test(v)) v = 'https://' + v;
    const r = await window.electron.saveServer(v);
    $('error').textContent = r && r.ok ? '' : (r && r.error) || 'No se pudo guardar';
  };
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && !$('server').hidden && server) window.electron.retry(); });
  show(q.get('mode') === 'offline' ? 'offline' : 'server');
</script>
</body>
</html>
