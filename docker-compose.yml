# Ebano Control (Syncro) on the server: database, backend, panel and WhatsApp (Evolution API).
# Only the panel is published, on 127.0.0.1:${EBANO_PORT}; the server's own web server
# (the one serving the other projects) forwards ebanocontrol.total-net.net to it.
#
#   git pull origin ebanocontrol
#   docker compose build backend frontend && docker compose up -d backend frontend
name: ebanocontrol

services:
  db:
    # pgvector: the schema uses the "vector" extension
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ebanocontrol
      POSTGRES_USER: ebano
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Falta DB_PASSWORD en .env}
      TZ: America/Caracas
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./backend/backups:/backups
    # Only reachable from the server itself (DBeaver through the SSH tunnel)
    ports:
      - "127.0.0.1:${DB_PORT:-5442}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ebano -d ebanocontrol"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    # A name of its own: the panel also sits on other projects' networks, which have their own "backend"
    networks:
      default:
        aliases: [ebanocontrol-backend]
    env_file: ./backend.env
    environment:
      DATABASE_URL: postgresql://ebano:${DB_PASSWORD}@db:5432/ebanocontrol
      PORT: "9000"
      TZ: America/Caracas
      # host nginx → panel nginx → backend: trust both hops for the real client IP
      TRUST_PROXY: "2"
      # WhatsApp through the Evolution container of this project
      EVOLUTION_API_URL: http://evolution:8080
      EVOLUTION_API_KEY: ${EVOLUTION_API_KEY:?Falta EVOLUTION_API_KEY en .env}
      BACKEND_WEBHOOK_URL: http://ebanocontrol-backend:9000/whatsapp/webhook
      # Remote assistance between different networks: the TURN server below (empty = STUN only)
      TURN_HOST: ${TURN_HOST:-}
      TURN_PORT: ${TURN_PORT:-3478}
      TURN_SECRET: ${TURN_SECRET:-}
    volumes:
      - uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy

  # WhatsApp: the business links its number with a QR from Configuración. Only reachable inside
  # this project; it sends the messages it receives straight to the backend.
  evolution:
    image: evoapicloud/evolution-api:v2.3.7
    restart: unless-stopped
    environment:
      SERVER_TYPE: http
      SERVER_PORT: "8080"
      SERVER_URL: http://evolution:8080
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY:?Falta EVOLUTION_API_KEY en .env}
      DATABASE_ENABLED: "true"
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://ebano:${DB_PASSWORD}@db:5432/evolution?schema=public
      DATABASE_CONNECTION_CLIENT_NAME: ebanocontrol
      DATABASE_SAVE_DATA_INSTANCE: "true"
      DATABASE_SAVE_DATA_NEW_MESSAGE: "false"
      DATABASE_SAVE_MESSAGE_UPDATE: "false"
      DATABASE_SAVE_DATA_CONTACTS: "false"
      DATABASE_SAVE_DATA_CHATS: "false"
      CACHE_REDIS_ENABLED: "false"
      CACHE_LOCAL_ENABLED: "true"
      DEL_INSTANCE: "false"
      LANGUAGE: es
      CONFIG_SESSION_PHONE_CLIENT: Syncro POS
      CONFIG_SESSION_PHONE_NAME: Chrome
      LOG_LEVEL: ERROR,WARN,INFO
      LOG_BAILEYS: warn
      NODE_OPTIONS: --dns-result-order=ipv4first
      TZ: America/Caracas
    volumes:
      - evolution-instances:/evolution/instances
    depends_on:
      db:
        condition: service_healthy

  # TURN for remote assistance: when the business's network and Syncro's can't see each other
  # (mobile data, strict routers), the video goes through here. It stays encrypted end to end; this
  # server only forwards it. Credentials are temporary, signed by the backend with TURN_SECRET.
  # Its own profile, so the rest starts without it:  docker compose --profile turn up -d coturn
  coturn:
    image: coturn/coturn:4.18.0
    profiles: [turn]
    restart: unless-stopped
    # Host network: it needs the UDP relay ports below as they are, without Docker's NAT
    network_mode: host
    environment:
      TURN_SECRET: ${TURN_SECRET:-}
      TURN_HOST: ${TURN_HOST:-ebanocontrol.total-net.net}
      TURN_PORT: ${TURN_PORT:-3478}
      # Public IP, or "public/private" when the server is behind the router's NAT
      TURN_EXTERNAL_IP: ${TURN_EXTERNAL_IP:-}
      # Only behind NAT: its own relay address, where two relayed computers meet
      TURN_PRIVATE_IP: ${TURN_PRIVATE_IP:-}
      TURN_MIN_PORT: ${TURN_MIN_PORT:-49160}
      TURN_MAX_PORT: ${TURN_MAX_PORT:-49200}
    # A small script so optional settings are only passed when they are set
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        [ -n "$$TURN_SECRET" ] || { echo "Falta TURN_SECRET en .env"; exit 1; }
        set -- --listening-port="$$TURN_PORT" --realm="$$TURN_HOST" \
          --use-auth-secret --static-auth-secret="$$TURN_SECRET" \
          --min-port="$$TURN_MIN_PORT" --max-port="$$TURN_MAX_PORT" \
          --fingerprint --no-cli --no-tls --no-multicast-peers --no-software-attribute \
          --user-quota=12 --total-quota=240 \
          --denied-peer-ip=0.0.0.0-0.255.255.255 \
          --denied-peer-ip=10.0.0.0-10.255.255.255 \
          --denied-peer-ip=100.64.0.0-100.127.255.255 \
          --denied-peer-ip=127.0.0.0-127.255.255.255 \
          --denied-peer-ip=169.254.0.0-169.254.255.255 \
          --denied-peer-ip=172.16.0.0-172.31.255.255 \
          --denied-peer-ip=192.168.0.0-192.168.255.255 \
          --log-file=stdout --simple-log
        # Relay only on the server's own address (not on Docker's internal networks):
        # the IP itself, or the private one in "public/private"
        if [ -n "$$TURN_EXTERNAL_IP" ]; then
          ADDR=$$(echo "$$TURN_EXTERNAL_IP" | cut -d/ -f2)
          set -- "$$@" --external-ip="$$TURN_EXTERNAL_IP" --listening-ip="$$ADDR" --relay-ip="$$ADDR"
        fi
        [ -n "$$TURN_PRIVATE_IP" ] && set -- "$$@" --allowed-peer-ip="$$TURN_PRIVATE_IP"
        exec turnserver "$$@"

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: /api
    restart: unless-stopped
    ports:
      # 127.0.0.1 when the server's web server runs on the host; 172.17.0.1 when it runs in Docker
      - "${EBANO_BIND:-127.0.0.1}:${EBANO_PORT:-8095}:80"
    depends_on:
      - backend

volumes:
  db-data:
  uploads:
  evolution-instances:
