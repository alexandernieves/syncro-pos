    # ── Ebano Control (ebanocontrol.total-net.net) · begin ──────────────────────
    # Port 80 only: Let's Encrypt validation, and the panel until the certificate exists.
    server {
        listen 80;
        server_name ebanocontrol.total-net.net;
        location ^~ /.well-known/acme-challenge/ {
            root /etc/letsencrypt/webroot-ebano;
        }
        location / {
            # Resolved on each request: if Ebano is down, this Nginx (and the other sites) still starts
            resolver 127.0.0.11 valid=30s;
            set $ebano http://ebanocontrol-frontend:80;
            proxy_pass $ebano;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            client_max_body_size 25m;
            proxy_read_timeout 120s;
        }
    }
    # ── Ebano Control · end ─────────────────────────────────────────────────────
