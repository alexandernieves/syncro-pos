# Serves the panel and proxies the API (and its websockets) to the backend container.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  client_max_body_size 25m;

  # "ebanocontrol.total-net.net." (with the final dot) is another origin for the browser: the
  # certificate shows as not secure and the API rejects it. Send it to the address without the dot.
  if ($http_host ~ "^(.+)\.(:\d+)?$") {
    return 301 https://$1$request_uri;
  }

  # Evolution delivers WhatsApp messages to the backend inside Docker: from the internet these
  # webhooks would let anyone post fake messages into the inbox
  location ~ ^/api/whatsapp/(bot-)?webhook {
    return 404;
  }

  # API and socket.io: /api/... goes to the backend without the /api prefix
  location /api/ {
    # Looked up on each request (a restarted backend gets a new address), by its own name:
    # the panel also sits on another project's network that has a container called "backend"
    resolver 127.0.0.11 valid=10s;
    set $backend http://ebanocontrol-backend:9000;
    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass $backend;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_read_timeout 120s;
  }

  # Static export with trailing slashes: /dashboard/gimnasio/ → /dashboard/gimnasio/index.html
  location / {
    try_files $uri $uri/ $uri.html =404;
  }
  error_page 404 /404.html;

  location /_next/static/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
}
